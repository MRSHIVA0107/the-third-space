name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within Supabase's 7-day limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keepalive Endpoint
        run: |
          # Replace with your deployed Vercel site URL once deployed:
          TARGET_URL="${{ secrets.SITE_URL || 'https://thethirdspace.vercel.app' }}/api/cron/keepalive"
          echo "Pinging: $TARGET_URL"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$TARGET_URL" || true)
          echo "$RESPONSE"
